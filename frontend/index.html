<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aprendices SENA - Frontend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="text-center mb-4">
        <h1 class="fw-bold">Registro de Aprendices SENA</h1>
        <p class="text-muted">Frontend nginx que consume la API del backend (Flask).</p>
      </div>

      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <form id="form-registro">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="nombre_completo" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombre_completo" required>
              </div>
              <div class="col-md-4">
                <label for="numero_documento" class="form-label">Número de documento</label>
                <input type="text" class="form-control" id="numero_documento" required>
              </div>
              <div class="col-md-4">
                <label for="ficha" class="form-label">Número de ficha</label>
                <input type="text" class="form-control" id="ficha" required>
              </div>
            </div>
            <div class="mt-4 text-end">
              <button type="submit" class="btn btn-primary">Registrar aprendiz</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-header">
          <h2 class="h5 mb-0">Aprendices registrados</h2>
        </div>
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Nombre completo</th>
                <th>Documento</th>
                <th>Ficha</th>
                <th>Creado en</th>
              </tr>
            </thead>
            <tbody id="tabla-aprendices">
              <tr>
                <td colspan="5" class="text-center text-muted">Cargando datos...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
