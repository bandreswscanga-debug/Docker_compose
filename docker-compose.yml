version: '3.8'
services:
  nginx:
    image: nginx:alpine
    container_name: proxy-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app-backend
    networks:
      - red-cba

  app-backend:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: app-backend
    ports:
      - "${APP_PORT}:5050"
    depends_on:
      - servidor-bd
    networks:
      - red-cba
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FLASK_DEBUG: ${FLASK_DEBUG}

  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - red-cba

networks:
  red-cba:

volumes:
  mysql-data:
