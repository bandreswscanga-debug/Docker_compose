services:
  proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: proxy-manager
    restart: always
    ports:
      - "80:80"     # HTTP (público)
      - "81:81"     # Panel admin (restringir por Security Group a IP propia)
      - "443:443"   # HTTPS (público)
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - red-cba

  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd
    restart: always

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    # 3306 NO se publica: solo es accesible por la red interna Docker
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro

    mem_limit: 512m

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - red-cba

  app-backend:
    build: .
    image: app-backend:local
    container_name: app-backend
    restart: always

    depends_on:
      servidor-bd:
        condition: service_healthy

    env_file:
      - .env

    # 5050 NO se publica: Nginx Proxy Manager lo alcanza por red interna
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:5050/', timeout=5).status == 200 else 1)"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - red-cba

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: always

    ports:
      - "3001:3001"

    volumes:
      - uptime-kuma-data:/app/data

    networks:
      - red-cba

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always

    # Solo accesible por localhost (túnel SSH). No expuesto a Internet.
    ports:
      - "127.0.0.1:9000:9000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

    networks:
      - red-cba

networks:
  red-cba:
    driver: bridge

volumes:
  mysql-data:
  portainer-data:
  uptime-kuma-data:
