services:
  proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: proxy-manager
    restart: always
    ports:
      - "80:80"     # HTTP
      - "81:81"     # Administración
      - "443:443"   # HTTPS
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - red-cba

  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd
    restart: always

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - red-cba

  app-backend:
    image: wscanga/app-backend:v2
    container_name: app-backend
    restart: always
    build: .

    depends_on:
      servidor-bd:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "${FLASK_PORT}:5050"

    volumes:
      - .:/home/myapp

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:5050/', timeout=5).status == 200 else 1)"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - red-cba

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always

    ports:
      - "9000:9000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

    networks:
      - red-cba

networks:
  red-cba:
    driver: bridge

volumes:
  mysql-data:
  portainer-data: