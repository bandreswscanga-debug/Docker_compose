name: CI/CD - Test y Despliegue

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar pruebas
        run: pytest test_app.py -v

      - name: Escanear seguridad
        run: |
          pip install bandit
          bandit -r . -x ./test_app.py --skip B101,B104

  build-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/app-backend:latest

      - name: Escanear contenedor con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/app-backend:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Subir imagen a Docker Hub
        run: docker push "${{ secrets.DOCKER_USERNAME }}/app-backend:latest"

      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: false
          script: |
            set -ex
            cd ~/Docker_compose
            git fetch origin main
            git reset --hard origin/main
            docker compose build app-backend
            docker compose up -d --no-build app-backend
            docker compose ps app-backend
